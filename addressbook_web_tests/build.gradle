plugins {
    id("java")
}

group = "org.example"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:5.9.1"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.seleniumhq.selenium:selenium-java:4.41.0")
    implementation("org.jcommander:jcommander:3.0")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.21.2")
    implementation("com.mysql:mysql-connector-j:9.6.0")
    implementation ("org.hibernate.orm:hibernate-core:7.3.1.Final")

    implementation "org.hibernate.orm:hibernate-core"
    implementation "jakarta.transaction:jakarta.transaction-api"

    agent "org.aspectj:aspectjweaver:1.9.22"

    testImplementation platform("io.qameta.allure:allure-bom:2.29.0")
    testImplementation "io.qameta.allure:allure-junit5"
}

tasks.test {
    useJUnitPlatform()
    if (project.hasProperty("browser")) {
        systemProperty("browser",project.property("browser"))
    }
    if (project.hasProperty("target")) {
        systemProperty("target",project.property("target"))
    }
    jvmArgs = [ "-javaagent:${configurations.agent.singleFile}" ]
}